name: Build Japnish Paints APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/japnishpaints/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable-nodpi

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "JapnishPaints"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.japnishpaints.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.japnishpaints.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName '1.1'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                  }

                  debug {
                      minifyEnabled false
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Japnish Paints</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#0B5ED7</item>

              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <!-- Internet -->
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <!-- Camera for QR Coupon Scanner -->
              <uses-permission android:name="android.permission.CAMERA" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false"
                  android:hardwareAccelerated="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/japnishpaints/app/MainActivity.java <<'EOF'
          package com.japnishpaints.app;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.CookieManager;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import androidx.annotation.NonNull;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {

              private WebView webView;

              private PermissionRequest pendingPermissionRequest;

              private static final int CAMERA_PERMISSION_REQUEST = 1001;

              private static final String APP_URL =
                      "https://japnishpaints.store/mobile/index.html";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  setupWebView();

                  webView.loadUrl(APP_URL);
              }

              private void setupWebView() {

                  WebSettings settings = webView.getSettings();

                  // JavaScript
                  settings.setJavaScriptEnabled(true);

                  // Storage / Login session
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);

                  // File / Content
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  // Display
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setSupportZoom(false);

                  settings.setLoadWithOverviewMode(false);
                  settings.setUseWideViewPort(false);

                  // Camera / Media
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  // Cookies / Login
                  CookieManager cookieManager =
                          CookieManager.getInstance();

                  cookieManager.setAcceptCookie(true);
                  cookieManager.setAcceptThirdPartyCookies(
                          webView,
                          true
                  );

                  /*
                   * Website navigation
                   */
                  webView.setWebViewClient(new WebViewClient() {

                      @Override
                      public boolean shouldOverrideUrlLoading(
                              WebView view,
                              WebResourceRequest request) {

                          Uri uri = request.getUrl();
                          String url = uri.toString();

                          if (url.startsWith(
                                  "https://japnishpaints.store/")) {

                              return false;
                          }

                          openExternalUrl(uri);

                          return true;
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(
                              WebView view,
                              String url) {

                          if (url.startsWith(
                                  "https://japnishpaints.store/")) {

                              return false;
                          }

                          openExternalUrl(Uri.parse(url));

                          return true;
                      }
                  });

                  /*
                   * WebView camera permission
                   */
                  webView.setWebChromeClient(
                          new WebChromeClient() {

                      @Override
                      public void onPermissionRequest(
                              final PermissionRequest request) {

                          runOnUiThread(() -> {

                              String[] resources =
                                      request.getResources();

                              boolean wantsCamera = false;

                              for (String resource : resources) {

                                  if (PermissionRequest
                                          .RESOURCE_VIDEO_CAPTURE
                                          .equals(resource)) {

                                      wantsCamera = true;
                                      break;
                                  }
                              }

                              if (!wantsCamera) {
                                  request.deny();
                                  return;
                              }

                              /*
                               * Android camera permission already granted
                               */
                              if (android.os.Build.VERSION.SDK_INT < 23 ||
                                      checkSelfPermission(
                                              Manifest.permission.CAMERA
                                      ) == PackageManager.PERMISSION_GRANTED) {

                                  request.grant(
                                          new String[]{
                                              PermissionRequest
                                                  .RESOURCE_VIDEO_CAPTURE
                                          }
                                  );

                                  return;
                              }

                              /*
                               * Android camera permission not granted.
                               * Save WebView request and ask Android.
                               */
                              pendingPermissionRequest = request;

                              requestPermissions(
                                      new String[]{
                                          Manifest.permission.CAMERA
                                      },
                                      CAMERA_PERMISSION_REQUEST
                              );
                          });
                      }
                  });
              }

              /*
               * Android permission result
               */
              @Override
              public void onRequestPermissionsResult(
                      int requestCode,
                      @NonNull String[] permissions,
                      @NonNull int[] grantResults) {

                  super.onRequestPermissionsResult(
                          requestCode,
                          permissions,
                          grantResults
                  );

                  if (requestCode ==
                          CAMERA_PERMISSION_REQUEST) {

                      if (pendingPermissionRequest != null) {

                          if (grantResults.length > 0 &&
                                  grantResults[0] ==
                                          PackageManager.PERMISSION_GRANTED) {

                              /*
                               * Android permission allowed.
                               * Now give camera permission to WebView.
                               */
                              pendingPermissionRequest.grant(
                                      new String[]{
                                          PermissionRequest
                                              .RESOURCE_VIDEO_CAPTURE
                                      }
                              );

                          } else {

                              pendingPermissionRequest.deny();
                          }

                          pendingPermissionRequest = null;
                      }
                  }
              }

              private void openExternalUrl(Uri uri) {

                  try {

                      Intent intent =
                              new Intent(
                                      Intent.ACTION_VIEW,
                                      uri
                              );

                      startActivity(intent);

                  } catch (Exception ignored) {
                  }
              }

              @Override
              public void onBackPressed() {

                  if (webView != null &&
                          webView.canGoBack()) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {

                  if (webView != null) {

                      webView.stopLoading();
                      webView.destroy();
                  }

                  super.onDestroy();
              }
          }
          EOF

      - name: Download Japnish Paints App Icon
        shell: bash
        run: |
          curl -fL --retry 3 \
            "https://japnishpaints.store/mobile/japnish-round-logo.png" \
            -o app/src/main/res/drawable-nodpi/ic_launcher.png

          if [ ! -s app/src/main/res/drawable-nodpi/ic_launcher.png ]; then
            echo "ERROR: Japnish Paints app icon download failed."
            exit 1
          fi

          echo "App icon downloaded successfully."
          file app/src/main/res/drawable-nodpi/ic_launcher.png

      - name: Generate Gradle Wrapper
        shell: bash
        run: |
          gradle wrapper --gradle-version 8.7

      - name: Build APK
        shell: bash
        run: |
          chmod +x gradlew

          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        shell: bash
        run: |
          mkdir -p output

          cp app/build/outputs/apk/debug/app-debug.apk \
             output/JapnishPaints.apk

          ls -lh output/JapnishPaints.apk

      - name: Upload Japnish Paints APK
        uses: actions/upload-artifact@v4
        with:
          name: JapnishPaints-APK
          path: output/JapnishPaints.apk
          if-no-files-found: error                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "JapnishPaints"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.japnishpaints.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.japnishpaints.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0.0'
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Japnish Paints</string>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#006B6B</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/japnishpaints/app/MainActivity.java <<'EOF'
          package com.japnishpaints.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.getSettings().setDatabaseEnabled(true);
                  webView.getSettings().setAllowFileAccess(true);
                  webView.getSettings().setAllowContentAccess(true);
                  webView.getSettings().setBuiltInZoomControls(false);
                  webView.getSettings().setDisplayZoomControls(false);

                  webView.setWebChromeClient(new WebChromeClient());

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(
                              WebView view,
                              WebResourceRequest request) {
                          return false;
                      }
                  });

                  webView.loadUrl(
                      "https://japnishpaints.store/mobile/index.html"
                  );
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          gradle --version
          gradle assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/JapnishPaints.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JapnishPaints-APK
          path: output/JapnishPaints.apk
