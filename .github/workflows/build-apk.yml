name: Build Japnish Paints APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. JAVA 17
      # =========================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # =========================================================
      # 3. GRADLE
      # =========================================================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'


      # =========================================================
      # 4. CREATE ANDROID PROJECT
      # =========================================================
      - name: Create Android project
        shell: bash
        run: |

          set -e

          mkdir -p app/src/main/java/com/japnishpaints/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable-nodpi


      # =========================================================
      # 5. SETTINGS GRADLE
      # =========================================================
      - name: Create settings.gradle
        shell: bash
        run: |

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "JapnishPaints"

          include(":app")
          EOF


      # =========================================================
      # 6. ROOT BUILD GRADLE
      # =========================================================
      - name: Create root build.gradle
        shell: bash
        run: |

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF


      # =========================================================
      # 7. APP BUILD GRADLE
      # =========================================================
      - name: Create app build.gradle
        shell: bash
        run: |

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {

              namespace 'com.japnishpaints.app'

              compileSdk 35

              defaultConfig {

                  applicationId 'com.japnishpaints.app'

                  minSdk 23

                  targetSdk 35

                  versionCode 69

                  versionName '69.0.0'
              }

              buildTypes {

                  debug {

                      minifyEnabled false
                  }

                  release {

                      minifyEnabled false

                      shrinkResources false
                  }
              }
          }
          EOF


      # =========================================================
      # 8. STRINGS
      # =========================================================
      - name: Create strings.xml
        shell: bash
        run: |

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <string name="app_name">
                  Japnish Paints
              </string>

          </resources>
          EOF


      # =========================================================
      # 9. STYLE
      # =========================================================
      - name: Create styles.xml
        shell: bash
        run: |

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:windowLightStatusBar">
                      true
                  </item>

                  <item name="android:statusBarColor">
                      #FFFFFF
                  </item>

                  <item name="android:navigationBarColor">
                      #FFFFFF
                  </item>

                  <item name="android:colorAccent">
                      #0B5ED7
                  </item>

              </style>

          </resources>
          EOF


      # =========================================================
      # 10. ANDROID MANIFEST
      # =========================================================
      - name: Create AndroidManifest.xml
        shell: bash
        run: |

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <uses-permission
                  android:name="android.permission.ACCESS_NETWORK_STATE" />

              <uses-permission
                  android:name="android.permission.CAMERA" />


              <application

                  android:allowBackup="true"

                  android:label="@string/app_name"

                  android:icon="@drawable/ic_launcher"

                  android:roundIcon="@drawable/ic_launcher"

                  android:theme="@style/AppTheme"

                  android:usesCleartextTraffic="false"

                  android:hardwareAccelerated="true">


                  <activity

                      android:name=".MainActivity"

                      android:exported="true"

                      android:screenOrientation="portrait">


                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


      # =========================================================
      # 11. DOWNLOAD JAPNISH PAINTS LOGO
      # =========================================================
      - name: Download app icon
        shell: bash
        run: |

          curl -fL --retry 5 \
            "https://japnishpaints.store/mobile/japnish-round-logo.png" \
            -o app/src/main/res/drawable-nodpi/ic_launcher.png

          test -s app/src/main/res/drawable-nodpi/ic_launcher.png


      # =========================================================
      # 12. MAIN ACTIVITY
      # =========================================================
      - name: Create MainActivity.java
        shell: bash
        run: |

          cat > app/src/main/java/com/japnishpaints/app/MainActivity.java <<'EOF'
          package com.japnishpaints.app;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Bundle;

          import android.webkit.CookieManager;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;


          public class MainActivity extends Activity {


              private WebView webView;

              private PermissionRequest pendingCameraRequest;

              private static final int CAMERA_PERMISSION = 1001;


              private static final String APP_URL =
                      "https://japnishpaints.store/mobile/index.html";


              @Override
              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  setContentView(webView);

                  setupWebView();

                  webView.loadUrl(APP_URL);
              }


              private void setupWebView() {


                  WebSettings settings =
                          webView.getSettings();


                  settings.setJavaScriptEnabled(true);

                  settings.setDomStorageEnabled(true);

                  settings.setDatabaseEnabled(true);


                  settings.setAllowFileAccess(true);

                  settings.setAllowContentAccess(true);


                  settings.setBuiltInZoomControls(false);

                  settings.setDisplayZoomControls(false);

                  settings.setSupportZoom(false);


                  settings.setMediaPlaybackRequiresUserGesture(false);


                  CookieManager cookieManager =
                          CookieManager.getInstance();


                  cookieManager.setAcceptCookie(true);


                  cookieManager.setAcceptThirdPartyCookies(
                          webView,
                          true
                  );


                  webView.setWebViewClient(
                          new WebViewClient() {


                      @Override
                      public boolean shouldOverrideUrlLoading(
                              WebView view,
                              WebResourceRequest request) {


                          Uri uri = request.getUrl();

                          String url = uri.toString();


                          if (url.toLowerCase().contains(".apk")) {

                              openExternal(uri);

                              return true;
                          }


                          if (url.startsWith(
                                  "https://japnishpaints.store/")) {

                              return false;
                          }


                          openExternal(uri);

                          return true;
                      }


                      @Override
                      public boolean shouldOverrideUrlLoading(
                              WebView view,
                              String url) {


                          if (url.toLowerCase().contains(".apk")) {

                              openExternal(Uri.parse(url));

                              return true;
                          }


                          if (url.startsWith(
                                  "https://japnishpaints.store/")) {

                              return false;
                          }


                          openExternal(Uri.parse(url));

                          return true;
                      }
                  });


                  webView.setWebChromeClient(
                          new WebChromeClient() {


                      @Override
                      public void onPermissionRequest(
                              final PermissionRequest request) {


                          runOnUiThread(() -> {


                              boolean cameraRequested = false;


                              for (String resource :
                                      request.getResources()) {


                                  if (PermissionRequest
                                          .RESOURCE_VIDEO_CAPTURE
                                          .equals(resource)) {

                                      cameraRequested = true;

                                      break;
                                  }
                              }


                              if (!cameraRequested) {

                                  request.deny();

                                  return;
                              }


                              if (checkSelfPermission(
                                      Manifest.permission.CAMERA
                              ) == PackageManager.PERMISSION_GRANTED) {


                                  request.grant(
                                          new String[]{
                                              PermissionRequest
                                                  .RESOURCE_VIDEO_CAPTURE
                                          }
                                  );

                                  return;
                              }


                              pendingCameraRequest = request;


                              requestPermissions(
                                      new String[]{
                                          Manifest.permission.CAMERA
                                      },
                                      CAMERA_PERMISSION
                              );

                          });
                      }
                  });
              }


              @Override
              public void onRequestPermissionsResult(
                      int requestCode,
                      String[] permissions,
                      int[] grantResults) {


                  super.onRequestPermissionsResult(
                          requestCode,
                          permissions,
                          grantResults
                  );


                  if (requestCode == CAMERA_PERMISSION) {


                      if (pendingCameraRequest != null) {


                          if (grantResults.length > 0 &&
                                  grantResults[0] ==
                                          PackageManager.PERMISSION_GRANTED) {


                              pendingCameraRequest.grant(
                                      new String[]{
                                          PermissionRequest
                                              .RESOURCE_VIDEO_CAPTURE
                                      }
                              );


                          } else {

                              pendingCameraRequest.deny();
                          }


                          pendingCameraRequest = null;
                      }
                  }
              }


              private void openExternal(Uri uri) {

                  try {

                      Intent intent =
                              new Intent(
                                      Intent.ACTION_VIEW,
                                      uri
                              );

                      startActivity(intent);

                  } catch (Exception ignored) {
                  }
              }


              @Override
              public void onBackPressed() {


                  if (webView != null &&
                          webView.canGoBack()) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();
                  }
              }


              @Override
              protected void onDestroy() {


                  if (webView != null) {

                      webView.destroy();
                  }


                  super.onDestroy();
              }
          }
          EOF


      # =========================================================
      # 13. GRADLE WRAPPER
      # =========================================================
      - name: Generate Gradle Wrapper
        shell: bash
        run: |

          gradle wrapper --gradle-version 8.7


      # =========================================================
      # 14. BUILD DEBUG APK
      # =========================================================
      - name: Build APK
        shell: bash
        run: |

          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace


      # =========================================================
      # 15. PREPARE APK
      # =========================================================
      - name: Prepare APK
        shell: bash
        run: |

          set -e

          mkdir -p output

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            output/JapnishPaints-v69-debug.apk


          echo "===================================="

          echo "JAPNISH PAINTS APK CREATED"

          echo "===================================="

          ls -lh output/JapnishPaints-v69-debug.apk


      # =========================================================
      # 16. VERIFY APK
      # =========================================================
      - name: Verify APK
        shell: bash
        run: |

          echo "===================================="

          echo "APK INFORMATION"

          echo "===================================="


          $ANDROID_HOME/build-tools/35.0.0/apksigner \
            verify \
            --verbose \
            output/JapnishPaints-v69-debug.apk


          echo "===================================="

          echo "APK SIGNING CERTIFICATE"

          echo "===================================="


          $ANDROID_HOME/build-tools/35.0.0/apksigner \
            verify \
            --print-certs \
            output/JapnishPaints-v69-debug.apk


      # =========================================================
      # 17. UPLOAD APK
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:

          name: JapnishPaints-APK-v69

          path: output/JapnishPaints-v69-debug.apk

          if-no-files-found: error
